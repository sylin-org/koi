# Single source of truth for the data path.
#
# The machine-scoped data root must be resolved ONCE at a composition root
# (Config::from_cli, the embedded builder, or a per-process CLI command) and
# translated into explicit domain-owned paths (`PersistencePaths`,
# `CertmeshPaths`) that are injected everywhere — no operational code
# re-resolves it ad hoc.
#
# The sanctioned derivation helpers in `koi-common` (koi_data_dir_with_override,
# koi_log_dir) and the genuine per-process
# composition roots carry an explicit `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "koi_common::paths::koi_data_dir", reason = "resolve the data dir once at a composition root and inject explicit domain persistence paths instead of re-resolving ad hoc" },
]
