[package]
name = "koi-lab"
description = "Non-published controller for Koi's physical integration lab"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
instant-acme.workspace = true
mdns-sd = "0.20"
rustls = "0.23"
koi-mdns = { path = "../../crates/koi-mdns" }
pem.workspace = true
rcgen.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
x509-parser.workspace = true
koi-compose = { path = "../../crates/koi-compose" }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 DNS-SD probe surface for the mDNS provider workstream (examples only).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
] }
