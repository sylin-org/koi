name: Release

on:
  push:
    tags:
      - 'v*'
  # Build-only dry run: validates the full cross-compile matrix (incl. the
  # aws-lc-sys musl/aarch64 builds) WITHOUT creating a release. The `release`
  # job is gated on a tag push, so a manual dispatch runs prepare+test+build only.
  workflow_dispatch:

# Validation jobs inherit only read access. Tag-only publication jobs declare their
# narrowly scoped writes below; a manual candidate dispatch cannot publish anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: koi

jobs:
  # ── Prepare ───────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      description: ${{ steps.meta.outputs.description }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          METADATA=$(node scripts/release-version.mjs --cargo Cargo.toml)
          VERSION=$(jq -r '.version' <<<"$METADATA")
          TAG=$(jq -r '.tag' <<<"$METADATA")
          PRERELEASE=$(jq -r '.prerelease' <<<"$METADATA")
          NPM_TAG=$(jq -r '.npmTag' <<<"$METADATA")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME disagrees with workspace release $TAG" >&2
            exit 1
          fi
          # Release description is the body of the latest CHANGELOG.md section
          # (everything between the first "## [" heading and the next one).
          DESCRIPTION=$(awk '/^## \[/{c++; if(c==2) exit; next} c==1' CHANGELOG.md)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "npm_tag=$NPM_TAG"
            echo "description<<__KOI_EOF__"
            echo "$DESCRIPTION"
            echo "__KOI_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo "Prerelease: $PRERELEASE"
          echo "npm dist-tag: $NPM_TAG"
          echo "Description:"
          echo "$DESCRIPTION"

  # ── Test ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: Rust workspace
        run: cargo test --workspace --locked
      - name: Release, launcher, and TypeScript client contracts
        run: >-
          node --test
          packages/ts/test/client.test.js
          packages/npm/test/launcher.test.js
          scripts/bootstrap-installers.test.mjs
          scripts/release-version.test.mjs
          scripts/release-manifest.test.mjs
          scripts/candidate-validation.test.mjs
      - name: Python client contracts
        env:
          PYTHONPATH: packages/python/src
        run: python -m unittest discover -s packages/python/tests -v
      - name: Current embedded frontend contracts
        run: cargo test --locked -p koi-dashboard

  # ── Build ─────────────────────────────────────────────────────────
  # Runs in parallel with `test` (not gated on it) so the 6 cross builds and the
  # ~6-min test suite overlap. `release` still requires `test` to pass, so a broken
  # commit never produces a GitHub Release or a crates.io publish.
  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_DIR="${BIN_NAME}-${VERSION}-${TARGET}"
          mkdir "$ARCHIVE_DIR"
          echo "ARCHIVE_DIR=${ARCHIVE_DIR}" >> "$GITHUB_ENV"

          # Copy binary
          BIN_SUFFIX=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_SUFFIX=".exe"
          fi
          cp "target/${TARGET}/release/${BIN_NAME}${BIN_SUFFIX}" "$ARCHIVE_DIR/"

          # Copy docs and licenses
          cp README.md "$ARCHIVE_DIR/" 2>/dev/null || true
          cp LICENSE* "$ARCHIVE_DIR/" 2>/dev/null || true

          # Create archive
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mkdir unsigned-staging
            mv "$ARCHIVE_DIR" unsigned-staging/
            echo "WINDOWS_STAGING=unsigned-staging" >> "$GITHUB_ENV"
          else
            tar czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
            echo "ASSET=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          shasum -a 256 "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
          cat "${{ env.ASSET }}.sha256"

      - name: Upload release artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Upload unsigned Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-${{ matrix.target }}
          path: ${{ env.WINDOWS_STAGING }}
          if-no-files-found: error
          retention-days: 1

  # ── Windows release archives ─────────────────────────────────────
  finalize-windows:
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: windows-input
          pattern: unsigned-windows-*

      - name: Finalize Windows archives
        shell: pwsh
        run: |
          ./scripts/finalize-windows-release.ps1 `
            -SourceDirectory windows-input `
            -OutputDirectory finalized `
            -VersionTag '${{ needs.prepare.outputs.tag }}'

      - name: Upload x86_64 Windows release
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            finalized/koi-${{ needs.prepare.outputs.tag }}-x86_64-pc-windows-msvc.zip
            finalized/koi-${{ needs.prepare.outputs.tag }}-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

      - name: Upload arm64 Windows release
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64-pc-windows-msvc
          path: |
            finalized/koi-${{ needs.prepare.outputs.tag }}-aarch64-pc-windows-msvc.zip
            finalized/koi-${{ needs.prepare.outputs.tag }}-aarch64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  # ── Distribution contract ────────────────────────────────────────
  # Exercise every thin publication consumer against the exact build matrix.
  # A manual dispatch reaches this job but publishes nothing.
  channels:
    needs: [prepare, build, finalize-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Build and verify the release manifest
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/release-manifest.test.mjs
          MANIFEST="artifacts/koi-${{ needs.prepare.outputs.tag }}-manifest.json"
          node scripts/release-manifest.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --artifacts artifacts \
            --output "$MANIFEST"

      - name: Assemble and pack the npm carriers
        working-directory: packages/npm
        run: |
          node scripts/build-carriers.mjs \
            --artifacts artifacts \
            --manifest "artifacts/koi-${{ needs.prepare.outputs.tag }}-manifest.json" \
            --out carriers
          npm ci
          npm test
          npm pack --dry-run
          for carrier in carriers/@sylin-org/koi-*; do
            (cd "$carrier" && npm pack --dry-run)
          done

      - name: Upload validated candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-manifest
          path: artifacts/koi-${{ needs.prepare.outputs.tag }}-manifest.json
          if-no-files-found: error
          retention-days: 14

  # A manual build produces one durable, machine-readable record for its exact
  # source and artifact manifest. It runs even when a dependency failed so that
  # the report names the missing/skipped/failing job, then fails the workflow.
  # Native links remain pending until R29 reconciles the built artifacts on each hat.
  candidate-summary:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [prepare, test, build, finalize-windows, channels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated candidate manifest
        id: manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: candidate-release-manifest
          path: candidate-artifacts

      - name: Record required hosted results
        shell: bash
        env:
          HOSTED_RESULTS: >-
            [{"name":"prepare","status":"${{ needs.prepare.result }}"},
             {"name":"test","status":"${{ needs.test.result }}"},
             {"name":"build","status":"${{ needs.build.result }}"},
             {"name":"finalize-windows","status":"${{ needs['finalize-windows'].result }}"},
             {"name":"channels","status":"${{ needs.channels.result }}"}]
        run: printf '%s\n' "$HOSTED_RESULTS" > candidate-hosted-results.json

      - name: Build candidate validation summary
        id: validation
        continue-on-error: true
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MANIFEST=$(find candidate-artifacts -maxdepth 1 -name 'koi-*-manifest.json' -print -quit)
          if [ -z "$MANIFEST" ]; then
            mkdir -p candidate-artifacts
            MANIFEST=candidate-artifacts/unavailable-manifest.json
            printf '{}\n' > "$MANIFEST"
          fi
          node scripts/candidate-validation.mjs \
            --source-sha "$GITHUB_SHA" \
            --manifest "$MANIFEST" \
            --hosted-results candidate-hosted-results.json \
            --run-url "$RUN_URL" \
            --output candidate-validation.json

      - name: Upload candidate validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-validation-${{ github.sha }}
          path: candidate-validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Add summary to the workflow run
        if: always()
        shell: bash
        run: |
          test -f candidate-validation.json
          {
            echo '## Candidate validation'
            echo
            echo "Source: \`$GITHUB_SHA\`"
            echo
            echo '```json'
            cat candidate-validation.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce candidate infrastructure result
        if: always()
        shell: bash
        env:
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          test "$MANIFEST_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success

  # ── Release ───────────────────────────────────────────────────────
  release:
    needs: [prepare, test, channels, finalize-windows]
    # Only create a GitHub Release on a real tag push; workflow_dispatch runs
    # the build matrix as a dry run and stops here.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # keyless (Sigstore) signing for build-provenance attestations
      attestations: write # write the attestations
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate the canonical release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --artifacts artifacts \
            --output "artifacts/koi-${{ needs.prepare.outputs.tag }}-manifest.json"

      # Signed build provenance for every published archive: `gh attestation verify
      # <file> --repo sylin-org/koi` proves it was built by this workflow, not a mirror.
      - name: Attest binary and manifest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.json

      - name: Generate release notes
        shell: bash
        env:
          # Pass via env: — env values are NOT re-parsed by bash, so backticks
          # and $() in the CHANGELOG body cannot trigger command substitution.
          # (Interpolating ${{ }} directly into a quoted assignment crashed this
          # step with exit 127 on any backtick in the notes.)
          VERSION: ${{ needs.prepare.outputs.tag }}
          DESCRIPTION: ${{ needs.prepare.outputs.description }}
        run: |
          # Read the template and substitute
          TEMPLATE=$(cat .github/release-template.md)
          NOTES="${TEMPLATE//\$\{VERSION\}/$VERSION}"
          # Bare (no leading v) version — matches the docker image tag, which
          # docker/metadata-action publishes as {{version}} (the v is stripped).
          VERSION_NO_V="${VERSION#v}"
          NOTES="${NOTES//\$\{VERSION_NO_V\}/$VERSION_NO_V}"
          NOTES="${NOTES//\$\{DESCRIPTION\}/$DESCRIPTION}"
          # Build checksums table
          CHECKSUMS=""
          for f in artifacts/*.sha256; do
            HASH=$(cut -d' ' -f1 "$f")
            FILE=$(basename "${f%.sha256}")
            CHECKSUMS="${CHECKSUMS}${HASH}  ${FILE}"$'\n'
          done
          NOTES="${NOTES//\$\{CHECKSUMS\}/$CHECKSUMS}"

          echo "$NOTES" > release-notes.md
          echo "--- Release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          RELEASE_FLAGS=(--verify-tag)
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          else
            RELEASE_FLAGS+=(--latest)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${RELEASE_FLAGS[@]}" \
            artifacts/*

  # ── Container image (GHCR) ─────────────────────────────────────────
  # Multi-arch image assembled from the exact musl binaries the `build` job
  # produced — no compile-in-Docker. Gated on `test` so a broken commit never
  # ships an image, and on a real tag push so the workflow_dispatch dry run does
  # not publish. Needs only the built-in GITHUB_TOKEN (packages: write).
  docker:
    needs: [prepare, test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image + its attestation to GHCR
      id-token: write # keyless (Sigstore) signing for the image attestation
      attestations: write # write the attestation
    steps:
      - uses: actions/checkout@v4

      - name: Download linux build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*-unknown-linux-musl
          merge-multiple: true

      - name: Stage binaries for buildx
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          # buildx arch (amd64/arm64) ← release triple (x86_64/aarch64-...-musl)
          for pair in "amd64:x86_64" "arm64:aarch64"; do
            docker_arch="${pair%%:*}"
            cpu="${pair##*:}"
            triple="${cpu}-unknown-linux-musl"
            tar xzf "artifacts/${BIN_NAME}-${TAG}-${triple}.tar.gz"
            cp "${BIN_NAME}-${TAG}-${triple}/${BIN_NAME}" "docker/release/koi-${docker_arch}"
          done
          chmod +x docker/release/koi-*
          ls -l docker/release/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Disable metadata-action's implicit floating tag. The centralized
          # release classifier below is the only evaluator allowed to advance it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/release
          file: docker/release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      # Signed build provenance for the image, pushed to GHCR as a referrer so
      # `gh attestation verify oci://ghcr.io/sylin-org/koi:<ver> --repo sylin-org/koi` works.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Publish to crates.io ──────────────────────────────────────────
  # Runs only after the GitHub Release succeeds (which requires all 6 cross
  # builds + tests to pass), and only on a real tag push — so a broken tag never
  # reaches the irreversible crates.io publish, and the workflow_dispatch dry run
  # never publishes. Reuses publish.yml (rate-limit bucketing + index verify).
  publish-crates:
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  # npm is a bootstrap channel for the native binary, not a second Koi runtime.
  # Publication stays inert until the @sylin-org/koi package has been created once,
  # its trusted publisher points at release.yml, and NPM_PUBLISH_ENABLED=true.
  publish-npm:
    needs: [prepare, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json

      - name: Use a trusted-publishing capable npm CLI
        run: npm install --global npm@latest

      - name: Download the released artifacts and contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts-release
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern "koi-${{ needs.prepare.outputs.tag }}-manifest.json" \
            --pattern "koi-${{ needs.prepare.outputs.tag }}-*.tar.gz" \
            --pattern "koi-${{ needs.prepare.outputs.tag }}-*.zip" \
            --dir artifacts-release
          for target in aarch64-apple-darwin aarch64-pc-windows-msvc aarch64-unknown-linux-musl x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-musl; do
            mkdir -p "artifacts-release/release-${target}"
            mv "artifacts-release/koi-${{ needs.prepare.outputs.tag }}-${target}".* "artifacts-release/release-${target}/"
          done

      - name: Assemble carriers from the released bytes
        working-directory: packages/npm
        run: |
          node scripts/build-carriers.mjs \
            --artifacts ../artifacts-release \
            --manifest ../artifacts-release/koi-${{ needs.prepare.outputs.tag }}-manifest.json \
            --out carriers
          npm ci
          npm test

      - name: Publish carriers, then the entry package
        working-directory: packages/npm
        run: |
          for carrier in carriers/@sylin-org/koi-*; do
            (cd "$carrier" && npm publish --access public --tag "${{ needs.prepare.outputs.npm_tag }}")
          done
          npm publish --access public --tag "${{ needs.prepare.outputs.npm_tag }}"
