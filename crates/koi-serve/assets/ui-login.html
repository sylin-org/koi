<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Koi operator view</title>
  <style>{{style}}</style>
  <script defer src="/ui/transport.js"></script>
</head>
<body>
  <form id="operator-login" class="operator-controls">
    <label for="operator-token">Daemon access token</label>
    <input id="operator-token" type="password" autocomplete="off" required>
    <button type="submit">Read catalog</button>
  </form>
  <div class="operator-controls">
    <button id="operator-refresh" type="button" hidden>Refresh snapshot</button>
    <button id="operator-forget" type="button" hidden>Forget token</button>
    <p id="operator-status" role="status">Operator access only. Use HTTPS or a loopback SSH tunnel. The token is kept only in this page's memory.</p>
  </div>
  <noscript>This operator view needs JavaScript only to send the authentication header. The native workbench does not.</noscript>
  <div id="operator-view"></div>
</body>
</html>
