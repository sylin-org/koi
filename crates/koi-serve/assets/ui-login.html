<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Koi operator view</title>
  <style>{{style}}</style>
  <script defer src="/ui/transport.js"></script>
</head>
<body class="operator-browser">
  <form id="operator-login" class="operator-controls operator-login-shell">
    <label for="operator-token">Daemon access token</label>
    <input id="operator-token" type="password" autocomplete="off" required>
    <button type="submit">Open operator view</button>
  </form>
  <div id="operator-session-controls" class="operator-controls operator-session-controls">
    <button id="operator-refresh" class="chrome-button" type="button" hidden><span>Refresh</span></button>
    <button id="operator-forget" class="chrome-button" type="button" hidden><span>Forget token</span></button>
    <p id="operator-status" role="status">Operator access only. Use HTTPS or a loopback SSH tunnel. The token is kept only in this page's memory.</p>
  </div>
  <noscript>This operator view uses JavaScript to send authenticated view requests and manage focus. Rust renders the service information. The native workbench uses ordinary page navigation.</noscript>
  <div id="operator-view"></div>
</body>
</html>
