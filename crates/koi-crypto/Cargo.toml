[package]
name = "koi-crypto"
description = "Key management, TOTP, signing, and encryption primitives for local network trust"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cryptography", "totp", "signing", "encryption", "key-management"]
categories = ["cryptography", "authentication"]

[dependencies]
koi-common.workspace = true
base64.workspace = true
# QR rendering (image PNG codec + qrcode) is optional — see the `qr` feature.
image = { workspace = true, optional = true }
utoipa.workspace = true
p256.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
totp-rs.workspace = true
qrcode = { workspace = true, optional = true }
pem.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# OS credential store (Credential Manager, login keychain, Linux kernel keyutils) is
# optional — see the `keyring` feature. Each store is target-specific.
keyring-core = { workspace = true, optional = true }
x25519-dalek.workspace = true
hkdf.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile = "3"
# Test-only: generate real leaf keys (PKCS#8 PEM) the way Koi enrolls them, to
# exercise the leaf-key signing helper against rcgen's actual key encoding.
rcgen.workspace = true

[features]
# `keyring` (OS credential store / TPM-style key sealing) and `qr` (qrcode + image PNG
# rendering) are rarely-run, heavy, single-module dependencies, each with a graceful
# fallback (vault passphrase backend; otpauth:// URI text). Default-on so the binary and
# existing consumers are byte-identical; lean library consumers drop them — and the
# credential-store + PNG-codec closures — with `default-features = false`.
default = ["keyring", "qr"]
keyring = [
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:linux-keyutils-keyring-store",
]
qr = ["dep:qrcode", "dep:image"]
