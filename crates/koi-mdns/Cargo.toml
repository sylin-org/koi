[package]
name = "koi-mdns"
description = "mDNS/DNS-SD service discovery and registration for the local network"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mdns", "dns-sd", "service-discovery", "zeroconf", "bonjour"]
categories = ["network-programming"]

[dependencies]
koi-common.workspace = true
async-trait.workspace = true
utoipa.workspace = true
mdns-sd = "0.20"
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
async-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio-util.workspace = true
hostname = "0.4"
if-addrs.workspace = true
socket2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Official Win32 DNS-SD (dnsapi.dll) and Bonjour (dnssd.dll) provider surfaces.
# Types stay inside their adapter modules; nothing escapes the session boundary.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
